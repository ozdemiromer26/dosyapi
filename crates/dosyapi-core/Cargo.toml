[package]
name = "dosyapi-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.92"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["serde", "formatting", "parsing", "macros"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zxcvbn = "3.1.1"

[lints]
workspace = true
