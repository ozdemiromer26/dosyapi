# Ters vekil örneği. TLS sertifikası nginx'te sonlanıyorsa config.toml içinde
# `trust_proxy = true` yapın: istemci IP'si yalnızca bu durumda başlıktan okunur.
server {
    listen 443 ssl http2;
    server_name dosya.sirket.com;

    ssl_certificate     /etc/letsencrypt/live/dosya.sirket.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dosya.sirket.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 520m;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name dosya.sirket.com;
    return 301 https://$host$request_uri;
}
